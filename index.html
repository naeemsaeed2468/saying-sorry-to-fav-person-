
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>I'm Sorry ❤️</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  min-height: 100vh;
  overflow: hidden;
  text-align: center;
  font-family: 'Segoe UI', sans-serif;
  color: #a31545;
  background: linear-gradient(135deg, #ffe4ec, #ffb5ca, #fff0f5);
}

h1 {
  margin-top: 25px;
  font-size: clamp(26px, 5vw, 42px);
  text-shadow: 0 3px 10px #ffffff;
}

.subtitle {
  margin-top: 10px;
  font-size: 17px;
}

.scene {
  height: 380px;
  position: relative;
  display: flex;
  justify-content: center;
  align-items: end;
}

.gift {
  position: absolute;
  bottom: 40px;
  width: 155px;
  height: 120px;
  background: #e73570;
  border: 4px solid #fff;
  border-radius: 12px;
  box-shadow: 0 15px 30px #ba456a55;
  z-index: 3;
}

.gift::before {
  content: "";
  position: absolute;
  height: 100%;
  width: 24px;
  left: 62px;
  background: #ffcfdd;
}

.lid {
  position: absolute;
  bottom: 150px;
  width: 175px;
  height: 30px;
  border-radius: 8px;
  background: #ff6697;
  border: 4px solid white;
  z-index: 5;
  animation: lidOpen 1.5s 1s forwards;
  transform-origin: left;
}

@keyframes lidOpen {
  100% {
    transform: rotate(-115deg) translateY(-35px);
  }
}

.teddy {
  position: absolute;
  bottom: 125px;
  font-size: 120px;
  z-index: 2;
  opacity: 0;
  animation: teddyPop 2s 1.5s forwards,
             teddyDance 2s 4s infinite ease-in-out;
  filter: drop-shadow(0 10px 8px #8e445055);
}

@keyframes teddyPop {
  0% {
    opacity: 0;
    transform: translateY(130px) scale(.4);
  }
  70% {
    opacity: 1;
    transform: translateY(-45px) scale(1.1);
  }
  100% {
    opacity: 1;
    transform: translateY(-15px) scale(1);
  }
}

@keyframes teddyDance {
  0%,100% { transform: translateY(-15px) rotate(-4deg); }
  50% { transform: translateY(-30px) rotate(4deg); }
}

.board {
  position: absolute;
  bottom: 270px;
  background: #fff;
  padding: 12px 17px;
  border: 3px solid #ff568c;
  border-radius: 15px;
  font-weight: bold;
  font-size: 15px;
  z-index: 6;
  opacity: 0;
  animation: boardAppear 1s 3.5s forwards;
  box-shadow: 0 5px 15px #ff7ca755;
}

@keyframes boardAppear {
  to { opacity: 1; transform: rotate(-5deg); }
}

.cat {
  position: absolute;
  bottom: 35px;
  font-size: 58px;
  animation: catDance 2s infinite ease-in-out alternate;
}

.cat-left { left: 5%; }
.cat-right { right: 5%; animation-delay: 1s; }

@keyframes catDance {
  to { transform: translateY(-15px) rotate(6deg); }
}

.rose {
  position: absolute;
  font-size: 32px;
  animation: roseFloat 3s infinite ease-in-out;
}

@keyframes roseFloat {
  50% { transform: translateY(-20px) rotate(12deg); }
}

.r1 { left: 20%; top: 25%; }
.r2 { right: 20%; top: 30%; }
.r3 { left: 32%; top: 10%; }
.r4 { right: 32%; top: 12%; }

.buttons {
  margin-top: 10px;
  position: relative;
  z-index: 10;
}

button {
  padding: 13px 23px;
  margin: 8px;
  border: none;
  border-radius: 30px;
  background: #e8326d;
  color: white;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
  box-shadow: 0 5px 12px #bb446655;
  transition: .3s;
}

button:hover {
  transform: scale(1.12);
  background: #bd174f;
}

#message {
  font-size: 20px;
  font-weight: bold;
  margin: 15px;
  padding: 0 10px;
}

.heart {
  position: fixed;
  top: -30px;
  animation: fall linear forwards;
  pointer-events: none;
  z-index: 20;
}

@keyframes fall {
  to {
    transform: translateY(110vh) rotate(360deg);
    opacity: 0;
  }
}

@media(max-width:500px) {
  .scene { height: 340px; }
  .cat { font-size: 42px; }
  .teddy { font-size: 100px; }
  .gift { width: 130px; height: 100px; }
  .gift::before { left: 50px; }
  .lid { width: 145px; bottom: 130px; }
  .board { bottom: 240px; font-size: 13px; }
  button { padding: 12px 16px; }
}
</style>
</head>

<body>

<h1>I'm Sorry ❤️</h1>
<p class="subtitle">I have a little surprise for you... 🥺</p>

<div class="scene">

  <div class="cat cat-left">🐱🌹</div>
  <div class="cat cat-right">🌹🐱</div>

  <div class="rose r1">🌹</div>
  <div class="rose r2">🌹</div>
  <div class="rose r3">💗</div>
  <div class="rose r4">❤️</div>

  <div class="teddy">🧸</div>

  <div class="board">
    I'M SORRY 🥺<br>
    Please Forgive Me ❤️
  </div>

  <div class="gift"></div>
  <div class="lid"></div>

</div>

<div class="buttons">
  <button onclick="yesClick()">Forgive Me ❤️</button>
  <button onclick="noClick()">No 😭</button>
  <button onclick="hugClick()">Send Hug 🤗</button>
</div>

<div id="message"></div>

<script>

function yesClick() {
  document.getElementById("message").innerHTML =
    "Yayyy! Thank you for forgiving me 🥹❤️🌹";
  hearts();
}

function noClick() {
  document.getElementById("message").innerHTML =
    "Please maan jao na 🥺 I am really sorry 💔";
}

function hugClick() {
  document.getElementById("message").innerHTML =
    "Sending you the biggest hug ever 🤗❤️";
  hearts();
}

function hearts() {
  for(let i = 0; i < 35; i++) {
    let heart = document.createElement("div");
    heart.className = "heart";
    heart.innerHTML = ["❤️","💗","🌹","💕","💖"][Math.floor(Math.random()*5)];

    heart.style.left = Math.random()*100 + "vw";
    heart.style.animationDuration = (2+Math.random()*3) + "s";
    heart.style.fontSize = (15+Math.random()*25) + "px";

    document.body.appendChild(heart);

    setTimeout(() => heart.remove(), 5000);
  }
}

// Background hearts animation
setInterval(() => {
  let heart = document.createElement("div");
  heart.className = "heart";
  heart.innerHTML = ["❤️","🌸","💕","🌹"][Math.floor(Math.random()*4)];
  heart.style.left = Math.random()*100 + "vw";
  heart.style.animationDuration = "5s";
  heart.style.fontSize = "20px";

  document.body.appendChild(heart);
  setTimeout(() => heart.remove(), 5000);
}, 700);

</script>

</body>
</html>
